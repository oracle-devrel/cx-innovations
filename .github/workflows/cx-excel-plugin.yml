name: CX Excel plugin

on:
  push:
    paths:
      - 'cx-excel-plugin/**'
      - '.github/workflows/cx-excel-plugin.yml'
  pull_request:
    paths:
      - 'cx-excel-plugin/**'
      - '.github/workflows/cx-excel-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cx-excel-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Save resolved dependency versions
        uses: actions/upload-artifact@v4
        with:
          name: cx-excel-plugin-lockfile
          path: cx-excel-plugin/package-lock.json
          retention-days: 7
